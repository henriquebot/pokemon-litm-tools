name: Build Foundry Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v5


      - name: Setup Node
        uses: actions/setup-node@v5

        with:
          node-version: "22"


      - name: Resolve version
        id: vars
        shell: bash

        run: |

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then

            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

          else

            python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open(
              "module.json",
              encoding="utf-8-sig"
          ) as f:
              print(
                  "version="
                  +
                  json.load(f)["version"]
              )
          PY

          fi


      - name: Clone asset sources
        shell: bash

        run: |

          rm -rf \
            /tmp/pokemon-assets \
            /tmp/gen1recomp-mods

          git clone \
            --depth 1 \
            https://github.com/righthandofvecna/pokemon-assets.git \
            /tmp/pokemon-assets

          git clone \
            --depth 1 \
            --branch master \
            https://github.com/LucianoNeo/gen1recomp-mods.git \
            /tmp/gen1recomp-mods


      - name: Generate catalog
        shell: bash

        run: |

          node \
            tools/build-catalog.mjs \
            /tmp/pokemon-assets \
            /tmp/gen1recomp-mods


      - name: Add Pokemon height metadata
        shell: bash

        run: |
          node tools/enrich-heights.mjs


      - name: Validate catalog
        shell: bash

        run: |

          node --input-type=module <<'NODE'

          import fs from "node:fs";

          const c =
            JSON.parse(
              fs.readFileSync(
                "data/catalog.json",
                "utf8"
              )
            );

          const animatedPokemon =
            c.pokemon.filter(
              x => x.animation
            ).length;

          const hgss =
            c.people.filter(
              x =>
                x.provider
                ===
                "hgss-sprites"
            );

          const players =
            c.people.filter(
              x =>
                x.personType
                ===
                "player"
            );

          const leaders =
            c.people.filter(
              x =>
                x.personType
                ===
                "gym-leader"
            );

          if (c.people.length < 100) {
            throw new Error(
              `Only ${c.people.length} people`
            );
          }

          if (hgss.length < 15) {
            throw new Error(
              `Only ${hgss.length} HGSS people`
            );
          }

          if (players.length < 3) {
            throw new Error(
              "Missing player characters"
            );
          }

          if (leaders.length < 5) {
            throw new Error(
              "Missing Gym Leaders"
            );
          }

          if (c.pokemon.length < 200) {
            throw new Error(
              `Only ${c.pokemon.length} Pokémon`
            );
          }

          if (animatedPokemon < 200) {
            throw new Error(
              `Only ${animatedPokemon} animated Pokémon`
            );
          }

          if (c.props.length < 1) {
            throw new Error(
              "No props"
            );
          }

          console.log(
            `Validated: ` +
            `${c.people.length} people ` +
            `(${hgss.length} HGSS), ` +
            `${c.pokemon.length} Pokémon, ` +
            `${c.props.length} props.`
          );

          NODE


      - name: Build Foundry package

        env:
          VERSION: ${{ steps.vars.outputs.version }}
          REF_NAME: ${{ github.ref_name }}

        shell: bash

        run: |

          rm -rf release

          mkdir -p release/package

          cp -R \
            scripts \
            styles \
            templates \
            data \
            README.md \
            release/package/


          python3 <<'PY'

          import json
          import os

          with open(
              "module.json",
              "r",
              encoding="utf-8-sig"
          ) as f:

              manifest = json.load(f)

          version = os.environ["VERSION"]
          ref_name = os.environ["REF_NAME"]

          manifest["version"] = version

          manifest["download"] = (
              "https://github.com/"
              "henriquebot/"
              "pokemon-litm-tools/"
              f"releases/download/{ref_name}/"
              "pokemon-litm-tools.zip"
          )

          for target in (
              "release/package/module.json",
              "release/module.json"
          ):

              with open(
                  target,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      manifest,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

                  f.write("\n")

          PY


          cd release/package

          zip -r \
            ../pokemon-litm-tools.zip \
            .


      - name: Validate package
        shell: bash

        run: |

          test -f release/package/module.json
          test -f release/package/scripts/main.js
          test -f release/package/scripts/importer-app.js
          test -f release/package/templates/importer.hbs
          test -f release/package/styles/importer.css
          test -f release/package/data/catalog.json

          python3 -m json.tool \
            release/package/module.json \
            > /dev/null

          python3 -m json.tool \
            release/package/data/catalog.json \
            > /dev/null


      - name: Create GitHub Release

        if: startsWith(github.ref, 'refs/tags/')

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        shell: bash

        run: |

          gh release create \
            "${{ github.ref_name }}" \
            release/pokemon-litm-tools.zip \
            release/module.json \
            --title "${{ github.ref_name }}" \
            --generate-notes
